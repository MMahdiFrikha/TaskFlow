<main class="min-h-screen bg-slate-100 p-6 sm:p-8 space-y-10">
  <!-- Projects Section -->
  <section>
    <app-project-list></app-project-list>
  </section>

  <!-- Team Members Section -->
  <section class="border-t border-gray-200 pt-8">
    <div class="mb-4">
      <h2 class="text-lg font-bold text-gray-900 tracking-tight">Membres de l'équipe</h2>
      <p class="text-xs text-gray-500">Collaborateurs assignés aux différents projets</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
      @for (user of users(); track user.id) {
        <app-user-card [user]="user"></app-user-card>
      }
    </div>
  </section>
</main>

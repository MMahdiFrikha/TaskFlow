<div class="p-6 md:p-8 max-w-7xl mx-auto space-y-6">
  <!-- Barre de recherche -->
  <div class="w-full max-w-md">
    <input 
      type="text" 
      [(ngModel)]="searchTerm" 
      placeholder="Rechercher un projet..." 
      class="w-full pl-4 pr-10 py-2.5 bg-white border border-gray-300 rounded-xl shadow-xs text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
    />
  </div>

  <!-- Indication du projet sélectionné -->
  @if (selectedProject) {
    <div class="p-4 bg-blue-50/70 border border-blue-200 text-blue-900 text-sm rounded-xl flex items-center justify-between shadow-xs">
      <span>Projet sélectionné : <strong class="font-semibold">{{ selectedProject.name }}</strong></span>
      <button 
        (click)="selectedProject = null" 
        class="text-xs font-medium text-blue-700 hover:text-blue-900 underline cursor-pointer"
      >
        Réinitialiser
      </button>
    </div>
  }

  <!-- Grille : Notice filteredProjects() appelé en tant que Signal -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (project of filteredProjects(); track project.id) {
      <app-project-card 
        [project]="project" 
        (projectSelected)="onProjectSelected($event)"
      ></app-project-card>
    } @empty {
      <div class="col-span-full py-12 text-center bg-white rounded-2xl border border-dashed border-gray-300">
        <p class="text-sm text-gray-500 font-medium">Aucun projet ne correspond à votre recherche.</p>
      </div>
    }
  </div>
</div>

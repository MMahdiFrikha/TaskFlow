<div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 flex flex-col justify-between h-full">
  <div>
    <!-- Interpolation : Nom et Statut -->
    <div class="flex items-start justify-between gap-3 mb-2">
      <h3 class="text-lg font-bold text-gray-900">{{ project().name }}</h3>
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full border bg-slate-50 text-slate-700">
        {{ project().status }}
      </span>
    </div>

    <!-- Interpolation : Description -->
    <p class="text-sm text-gray-600 mb-5">
      {{ project().description }}
    </p>

    <!-- Intégration de TaskList via Property Binding -->
    <div class="border-t border-gray-100 pt-4">
      <h4 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-3">
        Tâches ({{ project().tasks.length }})
      </h4>
      <app-task-list [tasks]="project().tasks"></app-task-list>
    </div>
  </div>

  <!-- Event Binding : Bouton Sélectionner -->
  <div class="mt-6 pt-4 border-t border-gray-100 flex justify-end">
    <button 
      type="button" 
      (click)="selectProject()"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-lg transition"
    >
      Sélectionner
    </button>
  </div>
</div>

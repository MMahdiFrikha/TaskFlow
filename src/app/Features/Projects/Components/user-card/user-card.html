<div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm flex items-center gap-3">
  <!-- Avatar générique provisoire -->
  <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600 text-sm">
    {{ user().name.charAt(0) }}
  </div>

  <div class="overflow-hidden">
    <!-- 1. Pipe titlecase : première lettre de chaque mot en majuscule -->
    <h4 class="text-sm font-semibold text-gray-900 truncate">
      {{ user().name | titlecase }}
    </h4>

    <!-- 2. Pipe lowercase : email forcé en minuscules -->
    <p class="text-xs text-gray-500 truncate">
      {{ user().email | lowercase }}
    </p>
  </div>
</div>
